name: Documentation site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify generated Pyrofork documentation
        run: |
          if [ -f build-docs.sh ]; then
            bash build-docs.sh check
          else
            echo "::notice::Generator check will run after this site setup is copied to the Pyrofork repository root."
          fi

      - name: Install locked site dependencies
        run: python -m pip install --require-hashes -r requirements-docs.lock

      - name: Prepare a build-only Markdown copy
        run: python tools/prepare_site.py

      - name: Build and validate site
        run: zensical build --clean --strict

      - name: Check generated pages and search index
        run: python tools/check_site.py

      - name: Upload GitHub Pages artifact
        if: github.repository == 'xcyclonev3/pyrofork' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.repository == 'xcyclonev3/pyrofork' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
